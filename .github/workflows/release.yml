name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --log-level WARN FODB.spec
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/FODB.exe --generate-notes
